# Demo system 2: a longer, intensified high-density culture at 50 L, with a smaller
# capture column and a tighter aggregate specification.
#
# The analysis code is identical to demo_mab; only this file differs (ground rules
# section 4). A second config is how the notebook shows it generalises across systems
# instead of being tuned to one.
#
# All data generated from this config is SYNTHETIC.

[system]
name = "Demo intensified CHO process, 21-day, high-density"
product = "Fc-fusion protein"
cell_line = "CHO (illustrative parameters, not a fitted line)"
stage = "process development"
context_of_use = """Screen whether a high-density inoculum with a low glucose setpoint \
raises harvested mass per litre over the 14-day baseline, and whether the smaller \
capture column still clears aggregate to a 1.5% specification. Screening only."""
model_influence = "medium"
decision_consequence = "low"
seed = 20261116

# ---------------------------------------------------------------------------------
[upstream]
duration_h = 504          # 21 days
sample_interval_h = 12.0  # twice-daily sampling: a denser record than the 14-day process
shift_time_h = 120.0      # later shift, at day 5

[upstream.initial]
xv = 1.2          # 1e6 cells/mL: high-density inoculation
xd = 0.05
glc = 18.0        # mM: feeding engages early, as in an intensified process
gln = 5.0         # mM
lac = 0.5
amm = 0.5
titer = 0.0       # mg/L
volume = 50.0     # L

[upstream.feed]
glc_mM = 300.0               # richer feed to match the higher demand
gln_mM = 65.0
target_glc_mM = 8.0          # tighter setpoint: low glucose suppresses lactate overflow
bolus_fraction_of_volume = 0.050

[upstream.kinetics]
# Illustrative values, not a fit. Higher productivity and a higher lactate tolerance
# than demo_mab, which is what "intensified" means here.
mu_max_per_h = 0.043
qp_beta_mg_per_1e9cells_h = 1.20
ki_lac_mM = 110.0
kd_amm_max_per_h = 0.018

[upstream.sensitivity]
mu_max_per_h = [0.030, 0.056]
qp_beta_mg_per_1e9cells_h = [0.84, 1.56]
y_x_glc_1e9cells_per_mmol = [1.96, 3.64]
ki_lac_mM = [77.0, 143.0]
kd_amm_max_per_h = [0.013, 0.023]
ks_glc_mM = [0.7, 1.3]

# ---------------------------------------------------------------------------------
[downstream]
clarification_yield = 0.93   # higher cell density means a harder clarification

[downstream.capture.column]
diameter_cm = 20.0
bed_height_cm = 20.0
porosity_total = 0.85
porosity_interstitial = 0.35

[downstream.capture.resin]
name = "Protein A (illustrative)"
q_max_g_per_L_resin = 55.0
k_eq_L_per_g = 8.0
k_mass_transfer_per_min = 0.55

[downstream.capture.operation]
velocity_cm_per_h = 250.0
load_fraction_of_dbc = 0.75
elution_recovery = 0.95
hcp_log_reduction = 3.0
dna_log_reduction = 3.5
aggregate_removal_fraction = 0.30
leached_protein_a_ng_per_mg = 8.0

[downstream.polish_cex]
yield_fraction = 0.88
hcp_log_reduction = 1.6
dna_log_reduction = 1.5
aggregate_removal_fraction = 0.80
protein_a_log_reduction = 1.5

[downstream.polish_aex]
yield_fraction = 0.95
hcp_log_reduction = 1.8
dna_log_reduction = 3.0
aggregate_removal_fraction = 0.20
protein_a_log_reduction = 1.0

[downstream.viral_filtration]
yield_fraction = 0.97

[downstream.ufdf]
target_concentration_g_per_L = 80.0
diavolumes = 8.0
yield_fraction = 0.94
membrane_flux_LMH = 35.0
area_m2 = 0.5

[downstream.feed_impurities]
hcp_ng_per_mg = 220000.0
dna_pg_per_mg = 1400000.0
aggregate_percent = 8.0
leached_protein_a_ng_per_mg = 0.0

# ---------------------------------------------------------------------------------
[acceptance.titer_mg_per_L]
unit = "mg/L"
lower = 3000.0
kind = "KPI"

[acceptance.final_viability_percent]
unit = "%"
lower = 60.0
kind = "PROCESS"

[acceptance.overall_yield_percent]
unit = "%"
lower = 60.0
kind = "KPI"

[acceptance.hcp_ng_per_mg]
unit = "ng/mg"
upper = 100.0
kind = "CQA"

[acceptance.dna_pg_per_mg]
unit = "pg/mg"
upper = 10.0
kind = "CQA"

[acceptance.aggregate_percent]
unit = "%"
upper = 1.5
kind = "CQA"

[acceptance.leached_protein_a_ng_per_mg]
unit = "ng/mg"
upper = 10.0
kind = "CQA"

# ---------------------------------------------------------------------------------
[answers]
data_source = "simulate"
n_batches = 9
scale_L = 50.0
feed_strategy = "fixed_bolus"
target_glc_mM = 8.0
duration_d = 21.0
shift_day = 5.0
lot_variation_cv = 0.10
run_sensitivity = true
sobol_base_samples = 64
run_monte_carlo = true
monte_carlo_samples = 120
kpi_target = "titer_mg_per_L"
batch_model = "random_forest"
model_features = ["seed_density_1e6_per_mL", "peak_vcd_1e6_per_mL", "ivcd_1e6_cell_day_per_mL", "final_lactate_mM"]
run_soft_sensor = true
soft_sensor_target = "glucose_mM"
soft_sensor_components = 5
baseline_correct_spectra = true
capture_velocity_cm_per_h = 250.0
capture_bed_height_cm = 20.0
load_fraction_of_dbc = 0.75
breakthrough_fraction = 0.10
run_convergence_study = true
polishing_order = ["polish_cex", "polish_aex"]
run_cost_estimate = true
annual_production_kg = 15.0
save_figures = true
